                solution: `<strong>Solution Steps:</strong><br>
                           <strong>1. Find the Associated Homogeneous Equation:</strong><br>
                           $a_n - 5a_{n-1} + 6a_{n-2} = 0$<br>
                           Characteristic equation: $r^2 - 5r + 6 = 0$<br>
                           $(r - 2)(r - 3) = 0 \\implies r_1 = 2, r_2 = 3$<br>
                           Homogeneous solution: $a_n^{(h)} = c_1(2^n) + c_2(3^n)$<br><br>
                           <strong>2. Find the Particular Solution ($a_n^{(p)}$):</strong><br>
                           Due to the non-homogeneous term $2^n$ (which matches root $r=2$), multiply trial solution by $n$:<br>
                           $a_n^{(p)} = c n 2^n$<br>
                           Substitute into the recurrence relation:<br>
                           $c n 2^n - 5c(n-1)2^{n-1} + 6c(n-2)2^{n-2} = 2^n$<br>
                           Dividing through by $2^{n-2}$:<br>
                           $4cn - 10c(n-1) + 6c(n-2) = 4$<br>
                           $4cn - 10cn + 10c + 6cn - 12c = 4 \\implies -2c = 4 \\implies c = -2$<br>
                           So, $a_n^{(p)} = -2n 2^n$<br><br>
                           <strong>3. General Solution:</strong><br>
                           $a_n = c_1(2^n) + c_2(3^n) - 2n 2^n$<br><br>
                           <strong>4. Apply Initial Conditions ($a_0 = 1, a_1 = 4$):</strong><br>
                           - For $n=0$: $c_1 + c_2 = 1$<br>
                           - For $n=1$: $2c_1 + 3c_2 - 4 = 4 \\implies 2c_1 + 3c_2 = 8$<br>
                           Solving the linear system yields $c_1 = -5$ and $c_2 = 6$.<br>
                           <strong>Final Solution:</strong> $a_n = -5(2^n) + 6(3^n) - 2n 2^n$.`

        let trackerData = [];
        let activeChapterIndex = 0;
        let currentYearFilter = "All";

        function init() {
            const savedData = localStorage.getItem('dsTrackerData_v8');
            if (savedData) {
                trackerData = JSON.parse(savedData);
                // Sync new data structure if questions were added
                if(trackerData.length !== courseData.length) trackerData = courseData;
            } else {
                trackerData = courseData;
            }
            
            populateYearDropdown();
            updateOverallProgress();
            renderSidebar();
            if (trackerData.length > 0) renderQuestions();
        }

        function saveData() {
            localStorage.setItem('dsTrackerData_v8', JSON.stringify(trackerData));
            updateOverallProgress();
            renderSidebar();
            
            if (trackerData.length > 0) {
                const chapter = trackerData[activeChapterIndex];
                const completedQ = chapter.questions.filter(q => q.done).length;
                document.getElementById('chapter-stats-text').innerText = `${completedQ} / ${chapter.questions.length} Questions Completed`;
            }
        }

        function populateYearDropdown() {
            const select = document.getElementById('year-filter');
            const years = new Set();
            
            trackerData.forEach(chapter => {
                chapter.questions.forEach(q => {
                    const yearMatch = q.meta.match(/\d{4}/);
                    if (yearMatch) years.add(yearMatch[0]);
                });
            });

            const sortedYears = Array.from(years).sort((a, b) => b - a);
            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.innerText = year;
                select.appendChild(option);
            });
        }

        function updateOverallProgress() {
            let total = 0;
            let completed = 0;

            trackerData.forEach(chapter => {
                chapter.questions.forEach(q => {
                    total++;
                    if (q.done) completed++;
                });
            });

            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('overall-progress-text').innerText = `${percentage}%`;
            document.getElementById('overall-progress-fill').style.width = `${percentage}%`;
        }

        function renderSidebar() {
            const chapterList = document.getElementById('chapter-list');
            chapterList.innerHTML = '';

            trackerData.forEach((chapter, index) => {
                const totalQ = chapter.questions.length;
                const completedQ = chapter.questions.filter(q => q.done).length;

                const btn = document.createElement('button');
                btn.className = `chapter-btn ${index === activeChapterIndex ? 'active' : ''}`;
                const shortName = chapter.chapterName.split(':')[1] || chapter.chapterName;

                btn.innerHTML = `
                    <span>${shortName.trim()}</span>
                    <span class="chapter-progress-badge">${completedQ}/${totalQ}</span>
                `;
                
                btn.onclick = () => {
                    activeChapterIndex = index;
                    renderSidebar();
                    renderQuestions();
                };

                chapterList.appendChild(btn);
            });
        }

        function renderQuestions() {
            const chapter = trackerData[activeChapterIndex];
            document.getElementById('current-chapter-title').innerText = chapter.chapterName;
            
            const completedQ = chapter.questions.filter(q => q.done).length;
            document.getElementById('chapter-stats-text').innerText = `${completedQ} / ${chapter.questions.length} Questions Completed`;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            currentYearFilter = document.getElementById('year-filter').value;

            const filteredQuestions = chapter.questions.filter(q => {
                if (currentYearFilter === "All") return true;
                return q.meta.includes(currentYearFilter);
            });

            if (filteredQuestions.length === 0) {
                container.innerHTML = `<div class="empty-state">No questions found for the selected year in this chapter.</div>`;
                return;
            }

            filteredQuestions.forEach((q) => {
                const originalIndex = chapter.questions.findIndex(oq => oq.id === q.id);
                const card = document.createElement('div');
                card.className = `question-card ${q.done ? 'completed' : ''}`;

                const checkboxWrapper = document.createElement('div');
                checkboxWrapper.className = 'checkbox-wrapper';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = q.done;
                
                checkbox.addEventListener('change', (e) => {
                    trackerData[activeChapterIndex].questions[originalIndex].done = e.target.checked;
                    if(e.target.checked) card.classList.add('completed');
                    else card.classList.remove('completed');
                    saveData();
                });

                checkboxWrapper.appendChild(checkbox);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'question-content';

                const metaDiv = document.createElement('div');
                metaDiv.className = 'question-meta';
                metaDiv.innerText = q.meta;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'question-text';
                textDiv.innerHTML = q.text;

                contentDiv.appendChild(metaDiv);
                contentDiv.appendChild(textDiv);
                
                if (q.imageUrl && q.imageUrl.trim() !== "") {
                    const img = document.createElement('img');
                    img.src = q.imageData || q.imageUrl;
                    img.className = 'img-preview';
                    
                    img.onerror = function() {
                        this.style.display = 'none';
                        const instructions = document.createElement('div');
                        instructions.className = 'empty-state';
                        instructions.style.marginTop = '15px';
                        instructions.style.padding = '20px';
                        instructions.innerHTML = `Missing Upload: <strong>${q.imageUrl}</strong><br><br>Please select an image file:`;

                        const upload = document.createElement('input');
                        upload.type = 'file';
                        upload.accept = 'image/*';
                        upload.style.display = 'block';
                        upload.style.margin = '12px auto 0';

                        upload.addEventListener('change', (event) => {
                            const file = event.target.files[0];
                            if (!file || !file.type.startsWith('image/')) return;
                            const reader = new FileReader();
                            reader.onload = () => {
                                q.imageData = reader.result;
                                img.src = q.imageData;
                                img.style.display = 'block';
                                instructions.remove();
                                saveData();
                            };
                            reader.readAsDataURL(file);
                        });

                        instructions.appendChild(upload);
                        contentDiv.appendChild(instructions);
                    };
                    
                    contentDiv.appendChild(img);
                }

                if (q.solution) {
                    const solBtn = document.createElement('button');
                    solBtn.className = 'solution-btn';
                    solBtn.innerText = 'Show Solution';
                    
                    const solDiv = document.createElement('div');
                    solDiv.className = 'solution-content';
                    solDiv.innerHTML = q.solution;

                    solBtn.onclick = () => {
                        solDiv.classList.toggle('show');
                        solBtn.innerText = solDiv.classList.contains('show') ? 'Hide Solution' : 'Show Solution';
                        if (window.MathJax && solDiv.classList.contains('show')) {
                            window.MathJax.typesetPromise([solDiv]);
                        }
                    };

                    contentDiv.appendChild(solBtn);
                    contentDiv.appendChild(solDiv);
                }

                card.appendChild(checkboxWrapper);
                card.appendChild(contentDiv);
                container.appendChild(card);
            });
            
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch(function (err) {
                    console.log('MathJax formatting error: ', err.message);
                });
            }
        }

        init();
    </script>
</body>
</html>
